<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo Steam — Галерея | Лаб. 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">🌍 Geo Steam</a>
    <button class="nav-toggle" type="button">☰ Меню</button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">О проекте</a></li>
        <li><a href="gallery.html" class="active">Галерея</a></li>
        <li><a href="auth.html">Регистрация</a></li>
        <li><a href="feedback.html">Обратная связь</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-wrapper">
    <h1>Галерея путешествий</h1>
    <h2>Слайдшоу (Лаб. 1, п. 2.8)</h2>

    <nav class="anchor-nav">
      <a href="#slideshow">Слайдшоу</a>
      <a href="#photos">Фото</a>
      <a href="#video">Видео</a>
    </nav>

    <section id="slideshow" class="content-block animated-card">
      <div class="slideshow">
        <div class="slide active">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/World_map_blank_without_borders.svg/640px-World_map_blank_without_borders.svg.png" alt="Карта мира">
        </div>
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/BlankMap-World-Continents.png/640px-BlankMap-World-Continents.png" alt="Континенты">
        </div>
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Whole_world_-_land_and_oceans.jpg/640px-Whole_world_-_land_and_oceans.jpg" alt="Земля">
        </div>
        <div class="slideshow-controls">
          <button type="button" class="slide-prev">← Назад</button>
          <button type="button" class="slide-next">Вперёд →</button>
        </div>
      </div>
    </section>

    <section id="photos" class="content-block">
      <h3>Фотографии</h3>
      <div class="media-grid">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Globe_icon.svg/200px-Globe_icon.svg.png" alt="Глобус">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/200px-The_Earth_seen_from_Apollo_17.jpg" alt="Земля из космоса">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Compass_rose_pale.svg/200px-Compass_rose_pale.svg.png" alt="Компас">
      </div>
    </section>

    <section id="video" class="content-block">
      <h3>Видео</h3>
      <p><em>Демонстрация</em> HTML-тега <code>&lt;video&gt;</code>:</p>
      <br/>
      <video controls width="560">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Браузер не поддерживает видео.
      </video>
    </section>

    <p><a href="index.html">← На главную</a></p>
  </div>

  <footer>
    <p>Geo Steam | Галерея — слайдшоу CSS+JS</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
