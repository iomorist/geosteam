version: '3.8'

# Лабораторная №7: микросервисы + Docker
services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CLIENT_URL=http://localhost:3000
    volumes:
      - api-data:/app
    networks:
      - geosteam

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - geosteam

volumes:
  api-data:

networks:
  geosteam:
    driver: bridge
